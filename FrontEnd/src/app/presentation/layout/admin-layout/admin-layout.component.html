<div class="admin-shell">
  <!-- SENTINEL SIDEBAR -->
  <aside class="sentinel-sidebar">
    <div class="sidebar-brand">
      <div style="background: var(--primary); color: white; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; shadow: 0 4px 12px rgba(13,99,27,0.2);">
        <span class="material-symbols-outlined" style="font-size: 24px; color: white;">eco</span>
      </div>
      <div>
        <h1 class="brand-name" style="letter-spacing: -1px; font-weight: 700; font-size: 1.3rem;">EcoLlajta</h1>
        <p class="brand-sub">Municipality Admin</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/missions" routerLinkActive="active" class="nav-item">

      <a routerLink="/admin/rewards" routerLinkActive="active" class="nav-item">

      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">

      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="system-status">
        <span class="status-dot"></span>

      </div>
      <a class="nav-item" href="#">
        <span class="material-symbols-outlined">support_agent</span>
        Support
      </a>
      <a class="nav-item" routerLink="/dashboard">
        <span class="material-symbols-outlined">logout</span>
        Sign Out
      </a>
    </div>
  </aside>

  <!-- MAIN ADMIN CONTENT -->
  <div class="admin-main">
    <header class="admin-topbar">
      <router-outlet name="topbar"></router-outlet>

    <main class="admin-content">
      <router-outlet></router-outlet>
