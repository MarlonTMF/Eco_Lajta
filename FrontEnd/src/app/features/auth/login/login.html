<div class="split-layout animate-fade-in" style="height: 100vh; border-radius: 0; border: none;">
    <!-- Left: Hero -->
    <div class="split-left" style="position: relative;">
        <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&q=80&w=1000"
            alt="Green Future" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">COCHABAMBA SOSTENIBLE</span>
            <h1 class="hero-title">Un futuro verde para Cochabamba</h1>
            <p class="hero-subtitle">
                Únete a la red ecológica más grande de la región y transforma tus hábitos en impacto real.
            </p>
        </div>
    </div>

    <!-- Right: Login -->
    <div class="split-right login-panel">
        <header class="login-header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="material-symbols-outlined">eco</i>
                </div>
                <span class="logo-text">EcoKawsay</span>
            </div>
            <i class="material-symbols-outlined logo-decoration">spa</i>
        </header>

        <h2 class="login-title">Bienvenido de vuelta</h2>
        <p class="text-muted login-subtitle">
            Ingresa tus credenciales para continuar sumando por Cochabamba
        </p>

        <div class="divider">
            <span class="divider-label">CONTINÚA CON</span>
        </div>

        <div id="hiddenGoogleBtn" style="position: absolute; opacity: 0; pointer-events: none;"></div>

        <button type="button"
                class="btn-google"
                (click)="loginWithGoogle()"
                [disabled]="isLoading()"
                style="width: 100%; margin: 0 auto;">
            @if (!isLoading()) {
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" class="btn-google-icon">
                <span>Continuar con Google</span>
            } @else {
                <div class="spinner-google"></div>
                <span>Iniciando sesión...</span>
            }
        </button>

        <!-- Admin Entry Button (smaller and styled professionally) -->
        <div style="margin-top: 24px; display: flex; justify-content: center; width: 100%;">
            <button routerLink="/admin" style="background: none; border: 1px solid var(--border); color: var(--primary); padding: 8px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#f0fdf4'; this.style.borderColor='var(--primary)'" onmouseout="this.style.background='none'; this.style.borderColor='var(--border)'">
                <span class="material-symbols-outlined" style="font-size: 16px;">shield_person</span>
                Panel Admin
            </button>
        </div>
    </div>
</div>
