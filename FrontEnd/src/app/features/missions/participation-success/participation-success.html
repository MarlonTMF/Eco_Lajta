<div style="max-width: 500px; margin: 0 auto; text-align: center; padding: 40px 20px;">
    <div style="background: var(--surface); border-radius: 30px; padding: 40px; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; overflow: hidden;">
        
        <div style="background: var(--primary-container); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: var(--on-primary-container);">
            <i data-lucide="check-circle" style="width: 40px; height: 40px;"></i>
        </div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 8px;">¡Registro Exitoso!</h1>
        <p class="text-muted" style="margin-bottom: 32px;">Tu participación ha sido confirmada</p>
        
        <!-- Ticket Card -->
        <div style="background: white; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 32px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <div style="padding: 32px; border-bottom: 2px dashed var(--border); position: relative;">
                <!-- QR Simulation -->
                <div style="background: #F9FAF5; padding: 16px; border-radius: 16px; display: inline-block; margin-bottom: 16px; border: 1px solid var(--border);">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=EK-MISSION-PARQUE-SUR" alt="QR" style="width: 150px; height: 150px;">
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;">
                    Muestra este código al llegar para validar tu participación y ganar tus <span style="color: var(--primary); font-weight: 800;">450 Dirty Points</span>.
                </p>
                
                <!-- Ticket Perforations -->
                <div style="position: absolute; bottom: -12px; left: -12px; width: 24px; height: 24px; background: var(--surface); border-radius: 50%; border-right: 1px solid var(--border);"></div>
                <div style="position: absolute; bottom: -12px; right: -12px; width: 24px; height: 24px; background: var(--surface); border-radius: 50%; border-left: 1px solid var(--border);"></div>
            </div>
            
            <div style="padding: 24px; background: #F9FAF5; text-align: left;">
                <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                    <i data-lucide="leaf" style="color: var(--primary); width: 20px;"></i>
                    <div>
                        <div class="text-muted" style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Misión</div>
                        <div style="font-weight: 700;">Reforestación Parque Sur</div>
                    </div>
                </div>
                <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                    <i data-lucide="calendar" style="color: #00639a; width: 20px;"></i>
                    <div>
                        <div class="text-muted" style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Horario</div>
                        <div style="font-weight: 700;">08:30 AM - 15 Oct</div>
                    </div>
                </div>
                <div style="display: flex; gap: 16px;">
                    <i data-lucide="map-pin" style="color: #704d40; width: 20px;"></i>
                    <div>
                        <div class="text-muted" style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Lugar</div>
                        <div style="font-weight: 700;">Parque Sur (Punto de Encuentro)</div>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <button class="scanner-btn-side" style="width: 100%; padding: 16px; font-size: 1.1rem; margin: 0; background: var(--primary-container); color: var(--on-primary-container);">
                <i data-lucide="wallet"></i> Guardar en Wallet
            </button>
            <button class="btn-white" style="width: 100%; border: 2px solid var(--border); padding: 16px;" routerLink="/projects">
                Volver a Mis Misiones
            </button>
        </div>
    </div>
</div>
