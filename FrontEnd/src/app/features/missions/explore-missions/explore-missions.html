<div class="missions-wrap animate-fade-in">
  <header class="missions-header">

      <input type="search" placeholder="Buscar misiones, OTBs o proyectos..." aria-label="Buscar misiones">
    </div>
  </header>

  <div class="filters" role="tablist" aria-label="Filtrar misiones por categoría">

    <button type="button" class="filter-chip" role="tab" aria-selected="false">Reforestación</button>

      </div>
      <div style="text-align:right;">
        <div class="featured-date-label">Fecha</div>
        <div class="featured-date">24 Ago</div>
      </div>
    </div>

        <div class="mission-card-head">
          <h4 class="mission-card-title">Brigada Vidrio 2.0</h4>
          <span class="mission-card-cost">350 DP</span>
