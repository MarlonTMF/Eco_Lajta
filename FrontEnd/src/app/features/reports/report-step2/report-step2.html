<div class="split-layout" style="height: calc(100vh - 120px); border-radius: 24px; overflow: hidden; border: 1px solid var(--border);">
    <!-- Left: GPS Map Confirmation -->
    <div class="split-left">
        <img src="https://images.unsplash.com/photo-1518002171953-a080ee817e1f?w=800&q=80" alt="GPS Confirmation" style="width:100%; height:100%; object-fit:cover;">
        
        <div class="gps-overlay">
            <h2 style="font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 4px;">Confirm GPS Location</h2>
            <div style="display: flex; align-items: center; gap: 8px; color: var(--primary); font-size: 0.8rem; font-weight: 600;">
                <i data-lucide="crosshair" style="width:16px;"></i> High accuracy (± 2m)
            </div>
        </div>

        <div style="position: absolute; bottom: 24px; left: 24px; right: 24px; background: white; padding: 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: #E8F5E9; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                <i data-lucide="map-pin"></i>
            </div>
            <div>
                <div class="text-muted" style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Current Address</div>
                <div style="font-weight: 700; font-size: 1.1rem;">Calle Los Pinos #452, Cochabamba</div>
            </div>
        </div>
    </div>

    <!-- Right: Evidence & Form -->
    <div class="split-right">
        <div style="margin-bottom: 32px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="text-muted" style="font-size: 0.8rem;">Reporting Progress</span>
                <span style="font-weight: 700; color: var(--primary); font-size: 0.8rem;">Step 2 of 3</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" style="width: 66%;"></div>
            </div>
        </div>

        <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 16px;">Evidence Captured</h3>
        <div style="position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px;">
            <img src="https://images.unsplash.com/photo-1611284446314-60a58ac0deb9?w=800&q=80" alt="Evidence" style="width: 100%; height: 250px; object-fit: cover;">
            <div class="badge-verified" style="position: absolute; top: 12px; right: 12px;">
                <i data-lucide="check-circle" style="width: 14px;"></i> AI Verified
            </div>
        </div>

        <div style="background: #E8F5E9; padding: 20px; border-radius: 16px; border: 1px solid rgba(27, 94, 32, 0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="background: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);"><i data-lucide="leaf"></i></div>
                <div>
                    <div class="text-muted" style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Potential Reward</div>
                    <div style="font-weight: 800; color: var(--primary);">+10 Dirty Points Tokens</div>
                </div>
            </div>
            <span style="background: var(--primary); color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800;">LEVEL UP</span>
        </div>

        <div style="margin-bottom: 32px;">
            <div class="text-muted" style="font-size: 0.8rem; font-weight: 600; margin-bottom: 8px;">Optional Note</div>
            <textarea placeholder="Describe the situation or provide more details..." style="width: 100%; border: none; border-bottom: 2px solid var(--border); padding: 12px 0; height: 100px; outline: none; font-size: 0.9rem; resize: none;"></textarea>
        </div>

        <div style="display: flex; gap: 16px;">
            <button class="scanner-btn-side" style="flex: 1; margin: 0; padding: 16px;" routerLink="/dashboard">Send Report <i data-lucide="send" style="width:18px;"></i></button>
            <button class="btn-white" style="border: 2px solid var(--border); padding: 16px 24px;" routerLink="/dashboard">Cancel</button>
        </div>
    </div>
</div>
