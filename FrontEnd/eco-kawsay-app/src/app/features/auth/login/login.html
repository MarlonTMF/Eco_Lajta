<div class="split-layout" style="height: 100vh; border-radius: 0; border: none;">
    <!-- Left: Hero Image -->
    <div class="split-left" style="position: relative;">
        <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&q=80&w=1000" alt="Green Future" style="width:100%; height:100%; object-fit:cover;">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);"></div>
        <div style="position: absolute; bottom: 40px; left: 40px; right: 40px; color: white;">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 16px;">Un futuro verde para Cochabamba</h1>
            <p style="font-size: 1.1rem; opacity: 0.9; line-height: 1.6;">Únete a la red ecológica más grande de la región y transforma tus hábitos en impacto real.</p>
        </div>
    </div>

    <!-- Right: Login Form -->
    <div class="split-right" style="display: flex; flex-direction: column; justify-content: center; padding: 40px 60px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px;">
            <div class="logo">
                <i data-lucide="leaf" style="color: var(--primary);"></i>
                <span style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">EcoKawsay</span>
            </div>
            <i data-lucide="leaf" style="width: 48px; height: 48px; color: #E8F5E9;"></i>
        </div>

        <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">Bienvenido de vuelta</h2>
        <p class="text-muted" style="margin-bottom: 40px;">Ingresa tus credenciales para continuar sumando por Cochabamba</p>

        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px;">Email o Usuario</label>
            <input type="text" placeholder="ejemplo@ecokawsay.org" style="width: 100%; padding: 16px; background: #F3F4F6; border: none; border-radius: 12px; outline: none; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <label style="font-size: 0.9rem; font-weight: 600;">Contraseña</label>
                <a href="#" style="font-size: 0.9rem; color: var(--primary); text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" placeholder="••••••••" style="width: 100%; padding: 16px; background: #F3F4F6; border: none; border-radius: 12px; outline: none; font-size: 1rem;">
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px;">
            <input type="checkbox" id="remember" style="width: 20px; height: 20px; accent-color: var(--primary);">
            <label for="remember" style="font-size: 0.95rem; color: var(--text-muted);">Recordar mi sesión</label>
        </div>

        <button style="width: 100%; padding: 18px; background: var(--primary); color: white; font-size: 1.1rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 32px;" routerLink="/dashboard">
            Iniciar Sesión <i data-lucide="log-in" style="width: 20px;"></i>
        </button>

        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px;">
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
            <span class="text-muted" style="font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">O CONTINÚA CON</span>
            <div style="flex: 1; height: 1px; background: var(--border);"></div>
        </div>

        <div style="display: flex; gap: 16px; margin-bottom: 40px;">
            <button style="flex: 1; padding: 14px; background: white; border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-weight: 600; color: var(--text);">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 20px;"> Google
            </button>
            <button style="flex: 1; padding: 14px; background: white; border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-weight: 600; color: var(--text);">
                <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" style="width: 20px;"> Facebook
            </button>
        </div>

        <p style="text-align: center; color: var(--text-muted); font-size: 0.95rem;">
            ¿No tienes cuenta? <a href="#" style="color: var(--primary); font-weight: 700; text-decoration: none;">Regístrate aquí</a>
        </p>
    </div>
</div>
