<div class="top-bar">
    <div class="search-container">
        <i data-lucide="search" style="width: 18px; color: var(--text-muted);"></i>
        <input type="text" placeholder="Search resources, rewards, missions...">
    </div>
    <div class="user-actions">
        <button class="icon-btn" routerLink="/notifications">
            <i data-lucide="bell"></i>
            <span class="notification-dot"></span>
        </button>
        <button class="icon-btn" routerLink="/settings">
            <i data-lucide="settings"></i>
        </button>
        <img src="https://i.pravatar.cc/100?img=11" alt="Profile" class="user-profile-thumb" routerLink="/profile" style="cursor: pointer;">
    </div>
</div>
